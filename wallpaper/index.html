<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monorail</title>
<style>
@font-face { font-family: "P3 Display"; src: url("fonts/BarlowCondensed-ExtraBoldItalic.ttf") format("truetype"); font-weight: 800; font-style: italic; }
@font-face { font-family: "P3 Bold"; src: url("fonts/BarlowCondensed-BoldItalic.ttf") format("truetype"); font-weight: 700; font-style: italic; }
@font-face { font-family: "P3 Text"; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); font-weight: 600; }
:root {
  --accent: #4cc3ff;
  --accent-deep: #0b2f7a;
  --red: #d8203a;
  --ink: #f2f9ff;
  --panel: rgba(6, 22, 60, 0.74);
  --panel-edge: rgba(150, 215, 255, 0.5);
}
body.darkhour { --accent: #b9f36a; --accent-deep: #1f4d14; --panel: rgba(4, 24, 12, 0.78); --panel-edge: rgba(190, 255, 120, 0.45); }
html, body { margin: 0; height: 100%; overflow: hidden; background: #061636; color: var(--ink); font-family: "P3 Text", "Segoe UI", sans-serif; user-select: none; }
#bg { position: fixed; inset: 0; background: url("background.jpg") center 40% / cover no-repeat; transition: filter 2.5s ease; }
#bg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; opacity: 0; }
#bg video.on { opacity: 1; }
#still { position: fixed; inset: 0; background: url("background.jpg") center 40% / cover no-repeat; opacity: 0; pointer-events: none; transition: opacity 1.2s ease, filter 2.5s ease; }
body.still #still { opacity: 1; }
body.darkhour #still { filter: grayscale(1) sepia(1) hue-rotate(38deg) saturate(2.4) brightness(0.62) contrast(1.15); }
#shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(4,14,40,0.35) 0%, rgba(4,14,40,0) 22%, rgba(4,14,40,0) 62%, rgba(4,14,40,0.55) 100%); }
#dh { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 2.5s ease; background: radial-gradient(ellipse at 50% 30%, rgba(190,255,110,0.18), rgba(10,40,10,0.55) 70%, rgba(0,10,0,0.75)); mix-blend-mode: multiply; }
body.darkhour #bg { filter: grayscale(1) sepia(1) hue-rotate(38deg) saturate(2.4) brightness(0.62) contrast(1.15); }
body.darkhour #dh { opacity: 1; }
.notrans * { transition: none !important; }

#cal { position: fixed; top: 4.2vh; right: 3.2vw; display: grid; justify-items: end; gap: 0.4vh; filter: drop-shadow(0 0.4vh 0.2vh rgba(0,0,0,0.55)); }
#cal .row { display: flex; align-items: flex-end; gap: 1vw; }
#md { font-family: "P3 Display", sans-serif; font-size: 10.5vh; line-height: 0.82; color: #fff; letter-spacing: -0.02em; text-shadow: 0.5vh 0.5vh 0 var(--accent-deep); }
#dow { font-family: "P3 Display", sans-serif; font-size: 4.2vh; line-height: 1; padding: 0.3vh 1.1vh 0.1vh; background: var(--accent); color: #061636; transform: skewX(-12deg); margin-bottom: 0.9vh; }
#dow.sun { background: var(--red); color: #fff; }
#slot { font-family: "P3 Bold", sans-serif; font-size: 3.4vh; letter-spacing: 0.12em; padding: 0.2vh 2.2vh 0.2vh 3vh; background: linear-gradient(90deg, transparent, var(--panel) 18%); border-right: 0.6vh solid var(--accent); }
#moonrow { display: flex; align-items: center; gap: 1vh; font-family: "P3 Bold", sans-serif; font-size: 2.1vh; letter-spacing: 0.1em; }
#moonc { width: 4.6vh; height: 4.6vh; }
#clock { font-family: "P3 Display", sans-serif; font-size: 5.4vh; line-height: 1; letter-spacing: 0.04em; color: #fff; text-shadow: 0.35vh 0.35vh 0 var(--accent-deep); }
#clock small { font-size: 2.6vh; color: var(--accent); margin-left: 0.6vh; }
#warn { font-family: "P3 Bold", sans-serif; font-size: 2vh; letter-spacing: 0.18em; color: #b9f36a; min-height: 2.4vh; }

#banner { position: fixed; left: 0; right: 0; top: 44vh; text-align: center; font-family: "P3 Display", sans-serif; font-size: 13vh; letter-spacing: 0.08em; color: rgba(190, 255, 120, 0); pointer-events: none; transition: color 2s ease; }
body.darkhour.intro #banner { color: rgba(190, 255, 120, 0.3); }

#player { --beat: 0; position: fixed; right: 2.4vw; bottom: 6.5vh; width: 30vw; min-width: 340px; max-width: 520px; transform: skewX(-8deg) scale(calc(1 + var(--beat) * 0.012)); transform-origin: 100% 100%; background: var(--panel); border: 1px solid var(--panel-edge); border-left: 0.7vh solid var(--accent); box-shadow: 0.8vh 0.8vh 0 rgba(0,0,0,0.45), 0 0 calc(var(--beat) * 3.2vh) calc(var(--beat) * 0.3vh) var(--accent); padding: 1.6vh 2vh 1.4vh; display: grid; gap: 0.9vh; overflow: hidden; backdrop-filter: blur(6px); }
#player > * { transform: skewX(8deg); }
#viz { position: absolute; inset: 0; width: 100%; height: 100%; opacity: calc(0.34 + var(--beat) * 0.3); transform: none; pointer-events: none; }
#flash { position: absolute; inset: 0; transform: none; pointer-events: none; background: linear-gradient(100deg, transparent 0%, var(--accent) 45%, transparent 75%); opacity: calc(var(--beat) * 0.16); mix-blend-mode: screen; }
#ptop { display: flex; align-items: center; gap: 1.2vh; position: relative; }
#tag { font-family: "P3 Bold", sans-serif; font-size: 1.6vh; letter-spacing: 0.22em; color: #061636; background: var(--accent); padding: 0.2vh 0.8vh; }
#src { font-size: 1.6vh; letter-spacing: 0.12em; opacity: 0.75; }
#player #filt { text-transform: uppercase; margin-left: auto; width: auto; height: auto; display: block; padding: 0.3vh 1vh; font-family: "P3 Bold", sans-serif; font-size: 1.5vh; letter-spacing: 0.14em; white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; color: var(--ink); background: rgba(0,0,0,0.35); border: none; transform: skewX(-8deg); }
#player #filt.on { color: #061636; background: var(--accent); border-color: var(--accent); }
#player #filt:hover { color: #061636; background: var(--accent); }
#title { font-family: "P3 Display", sans-serif; font-size: 3.3vh; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
#artist { font-size: 1.9vh; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; color: rgba(242, 249, 255, 0.75); }
#artist .game { font-family: "P3 Bold", sans-serif; font-size: 2.1vh; letter-spacing: 0.14em; color: var(--accent); }
#bar { height: 0.6vh; background: rgba(255,255,255,0.15); position: relative; cursor: pointer; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
#times { display: flex; justify-content: space-between; font-size: 1.6vh; opacity: 0.75; font-variant-numeric: tabular-nums; position: relative; }
#controls { display: flex; align-items: center; gap: 1.2vh; position: relative; }
#player button { all: unset; cursor: pointer; display: grid; place-items: center; width: 4.6vh; height: 4.6vh; color: var(--ink); background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); transform: skewX(-8deg); }
#player button:hover { background: var(--accent); color: #061636; }
#player button.on { color: var(--accent); border-color: var(--accent); }
#player button svg { width: 2.2vh; height: 2.2vh; transform: skewX(8deg); fill: currentColor; }
#play { width: 6vh !important; }
#vol { display: flex; align-items: center; gap: 1vh; font-size: 1.6vh; position: relative; }
#vollabel { font-family: "P3 Bold", sans-serif; letter-spacing: 0.18em; opacity: 0.8; }
#player #mute { width: 3.6vh; height: 3.6vh; }
#player #mute.on { color: var(--red); border-color: var(--red); }
#volhit { flex: 1; height: 3.6vh; display: flex; align-items: center; cursor: pointer; touch-action: none; }
#volbar { width: 100%; height: 0.8vh; background: rgba(255,255,255,0.18); position: relative; pointer-events: none; }
#volfill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
#volknob { position: absolute; top: 50%; width: 1.1vh; height: 2.2vh; background: var(--ink); transform: translate(-50%, -50%) skewX(-12deg); box-shadow: 0 0 0.6vh rgba(0,0,0,0.6); }
#volpct { width: 4.2vh; text-align: right; font-family: "P3 Bold", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
#vol.muted #volfill, #vol.muted #volknob { background: rgba(255,255,255,0.35); }
#player button.gone { display: none; }
#ptop #tag { white-space: nowrap; flex: none; }
#ptop #src { letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
#ptop #filt { flex: 0 1 auto; min-width: 0; max-width: 34%; }
#ptop #filtMenu { flex: none; }
#ptop { padding-right: 2.6vh; min-width: 0; }
#player { grid-template-columns: minmax(0, 1fr); }
#player #filtMenu { width: 3vh; height: auto; padding: 0.3vh 0; margin-left: 0.6vh; font-size: 1.5vh; color: var(--ink); background: rgba(0,0,0,0.35); border: none; transform: skewX(-8deg); }
#player #filtMenu.open, #player #filtMenu:hover { color: #061636; background: var(--accent); }
#plist { position: fixed; right: 3vw; bottom: calc(6.5vh + 30vh); width: 34vw; max-width: 640px; padding: 1.6vh 2vh 1.8vh; background: rgba(5, 7, 18, 0.95); border: none; border-left: 0.8vh solid var(--accent); box-shadow: 0.8vh 0.8vh 0 rgba(0,0,0,0.55); transform: skewX(-8deg) translateY(2vh); opacity: 0; pointer-events: none; transition: opacity 0.6s ease, transform 0.6s ease; z-index: 11; }
#plist.show { opacity: 1; transform: skewX(-8deg) translateY(0); pointer-events: auto; }
#plist > * { transform: skewX(8deg); }
#plist .ttl { font-family: "P3 Display", sans-serif; font-size: 2.6vh; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 1vh; }
#plistItems { display: grid; grid-template-columns: 1fr 1fr; gap: 0.2vh 1.4vh; }
#plistItems button { all: unset; text-transform: uppercase; cursor: pointer; display: flex; justify-content: space-between; gap: 1vh; min-width: 0; padding: 0.55vh 1.1vh; font-family: "P3 Bold", sans-serif; font-size: 1.8vh; letter-spacing: 0.08em; color: var(--ink); transform: skewX(-8deg); }
#plistItems button span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#plistItems button span:last-child { opacity: 0.55; font-variant-numeric: tabular-nums; }
#plistItems button:hover { background: var(--accent); color: #061636; }
#plistItems button.cur { background: var(--red); color: #fff; }
#plistItems button.cur span:last-child { opacity: 0.9; }
#player #like:hover { background: var(--red); color: #fff; }
#player #like.pop { animation: likepop 0.9s ease forwards; pointer-events: none; }
@keyframes likepop { 0% { transform: skewX(-8deg) scale(1); } 30% { transform: skewX(-8deg) scale(1.3); background: var(--red); color: #fff; } 100% { transform: skewX(-8deg) scale(0.5); opacity: 0; background: var(--red); color: #fff; } }
#player #del:hover { background: var(--red); color: #fff; }
#confirm { position: fixed; right: 3vw; bottom: calc(6.5vh + 34vh); width: 28vw; min-width: 320px; max-width: 480px; padding: 2vh 2.4vh; background: rgba(8, 8, 12, 0.92); border: 1px solid rgba(255,255,255,0.18); border-left: 0.8vh solid var(--red); box-shadow: 0.8vh 0.8vh 0 rgba(0,0,0,0.5); transform: skewX(-8deg) translateY(2vh); opacity: 0; pointer-events: none; transition: opacity 1s ease, transform 1s ease; z-index: 10; }
#confirm.show { opacity: 1; transform: skewX(-8deg) translateY(0); pointer-events: auto; }
#confirm > * { transform: skewX(8deg); }
#confirm .ttl { font-family: "P3 Display", sans-serif; font-size: 3.4vh; color: var(--red); letter-spacing: 0.04em; text-shadow: 0.3vh 0.3vh 0 #000; }
#confirm .song { font-family: "P3 Bold", sans-serif; font-size: 2.2vh; margin-top: 0.6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#confirm .sub { font-size: 1.6vh; opacity: 0.7; margin-top: 0.6vh; line-height: 1.35; }
#confirm .btns { display: flex; gap: 1.4vh; margin-top: 1.6vh; }
#confirm button { all: unset; cursor: pointer; padding: 0.8vh 2.2vh; font-family: "P3 Bold", sans-serif; font-size: 2vh; letter-spacing: 0.14em; transform: skewX(-8deg); }
#confirmYes { background: var(--red); color: #fff; }
#confirmYes:hover { background: #fff; color: var(--red); }
#confirmNo { border: 1px solid rgba(255,255,255,0.45); color: var(--ink); }
#confirmNo:hover { background: rgba(255,255,255,0.15); }
#hint { font-size: 1.6vh; opacity: 0.75; position: relative; line-height: 1.35; }
#credit { position: fixed; left: 1.2vw; bottom: 1vh; font-size: 1.3vh; letter-spacing: 0.08em; color: rgba(242, 249, 255, 0.35); }
body.noplayer #player, body.nocal #cal, body.nocredit #credit { display: none; }
</style>
</head>
<body class="intro">
<div id="bg"><video src="background.mp4" poster="background.jpg" autoplay muted playsinline disablepictureinpicture></video><video src="background.mp4" muted playsinline preload="auto" disablepictureinpicture></video></div>
<div id="still"></div>
<div id="dh"></div>
<div id="shade"></div>
<div id="banner">DARK HOUR</div>
<div id="cal">
  <div class="row"><span id="md">10/11</span><span id="dow">SUN</span></div>
  <div id="slot">EVENING</div>
  <div id="clock">00:00</div>
  <div id="moonrow"><canvas id="moonc" width="64" height="64"></canvas><span id="phase">FULL MOON</span></div>
  <div id="warn"></div>
</div>
<div id="player">
  <canvas id="viz" width="400" height="160"></canvas>
  <div id="flash"></div>
  <div id="ptop"><span id="tag">NOW PLAYING</span><span id="src">LOCAL</span><button id="filt" title="Click for the next playlist (right-click goes back)">ALL MUSIC</button><button id="filtMenu" title="Pick a playlist">&#9662;</button></div>
  <div id="title">No music yet</div>
  <div id="artist"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div id="controls">
    <button id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="play" title="Play"><svg viewBox="0 0 24 24" id="playicon"><path d="M7 4v16l13-8z"/></svg></button>
    <button id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button id="shuf" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M14 4h6v6l-2.2-2.2-4.3 4.3-1.6-1.6 4.3-4.3zM4 18.4 15.8 6.6l1.6 1.6L5.6 20zM14 20h6v-6l-2.2 2.2-2.6-2.6-1.6 1.6 2.6 2.6z"/></svg></button>
    <button id="rep" title="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
    <button id="like" class="gone" title="Like: play this one a little more often"><svg viewBox="0 0 24 24"><path d="M12 21s-7.4-4.5-9.5-9.2C1 8.4 3.1 4.6 6.7 4.6c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.6 0 5.7 3.8 4.2 7.2C19.4 16.5 12 21 12 21z"/></svg></button>
    <button id="del" class="gone" title="Remove this song"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1.1 12H7.1z"/></svg></button>
  </div>
  <div id="vol">
    <span id="vollabel">VOL</span>
    <button id="mute" title="Mute"><svg viewBox="0 0 24 24" id="muteicon"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.4 6a8.5 8.5 0 0 1 0 12L17 16.6a6.5 6.5 0 0 0 0-9.2z"/></svg></button>
    <div id="volhit" title="Volume (click, drag or scroll)"><div id="volbar"><div id="volfill"></div><div id="volknob"></div></div></div>
    <span id="volpct">60</span>
  </div>
  <div id="hint" hidden></div>
</div>
<div id="plist"><div class="ttl">PLAYLISTS</div><div id="plistItems"></div></div>
<div id="confirm">
  <div class="ttl" id="confirmTtl">REMOVE THIS SONG?</div>
  <div class="song" id="confirmSong"></div>
  <div class="sub" id="confirmSub">It gets moved to Music &rsaquo; Persona Desktop - removed songs, so you can still get it back.</div>
  <div class="btns" id="confirmBtns"><button id="confirmYes">REMOVE</button><button id="confirmNo">CANCEL</button></div>
</div>
<div id="credit">ART BY @JURAWINGS1</div>
<script src="music/playlist.js"></script>
<script src="hud.js"></script>
</body>
</html>
