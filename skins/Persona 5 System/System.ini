[Rainmeter]
LocalFont=#@#Fonts\Cartoonistkooky-p9za.otf

[Metadata]
Name= Persona 5 CPU and RAM
Author= ElysianAura
Information= This is a bar to display the CPU and RAM of a computer. It uses a modified version of the cartoonist font, which I'm not allowed to redistribute. 
License= Fair use, please give credit to ElysianAura and link my page uploading this.
Version= 1.0.0

[Variables]
FontName=Cartoonist
FontHeight=28
AntiAlias=1

[Background]
Meter=IMAGE
ImageName=ramcpu.png
AntiAlias=1

[MeasureCPU]
Measure=CPU
RegExpSubstitute=1
Substitute="^(\d\d)$":"0\0","^(\d)$":"00\0"

[MeasureRAM]
Measure=PhysicalMemory
RegExpSubstitute=1
Substitute="^(\d\d)$":"0\0","^(\d)$":"00\0"


[Label CPU]
Meter=STRING
X=0
Y=0
FontColor=#FontColor#
FontFace=#FontName#
FontSize=#FontHeight#
StringAlign=LEFT
StringStyle=Italic
StringEffect=Border
FontEffectColor=206, 134, 99, 160
AntiAlias=1

[Label RAM]
Meter=STRING
X=28
Y=55
FontColor=#FontColor#
FontFace=#FontName#
FontSize=#FontHeight#
StringAlign=LEFT
StringStyle=Italic
StringEffect=Border
FontEffectColor=206, 134, 99, 160
AntiAlias=1


[CPU]
Meter=STRING
MeasureName=MeasureCPU
X=123
Y=150
FontColor=106,254,221
FontFace=#FontName#
FontSize=#FontHeight#
StringAlign=RIGHT
StringStyle=Italic
AntiAlias=1
Text="%1"
Angle=(Rad(-11))

[RAM]
Meter=STRING
MeasureName=MeasureRAM
X=208
Y=134
FontColor=254,100,231
FontFace=#FontName#
FontSize=#FontHeight#
StringAlign=RIGHT
StringStyle=Italic
AntiAlias=1
Text="%1"
Percentual=1
AutoScale=1
Angle=(Rad(-11))

[MeterBar]
MeasureName=MeasureCPU
Meter=BAR
X=62
Y=177
W=150
H=5
BarOrientation=HORIZONTAL
BarImage=cpupersona.png

[MeterBar2]
MeasureName=MeasureRAM
Meter=BAR
X=84
Y=184
W=150
H=5
BarOrientation=HORIZONTAL
BarImage=rampersona.png
